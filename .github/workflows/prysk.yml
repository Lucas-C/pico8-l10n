name: Prysk

on:  # cf. https://github.community/t/how-to-trigger-an-action-on-push-or-pull-request-but-not-both/16662
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  sile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python 3.14 🔧
        uses: actions/setup-python@v6.1.0
        with:
          python-version: 3.14
      - name: Install & run Prysk
        run: |
          tools/build-with-luapak.sh  # build pico-l10n
          python -m pip install prysk
          cd cli-tests
          prysk *.t
