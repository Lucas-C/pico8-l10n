name: Build executable with Luapak
inputs:
  output_folder:
    description: The folder in which the generated executable file will be placed
    required: true
  product_file:
    description: The basename of the file to be generated
    required: true
  product_name:
    description: The name of the game
    required: true
runs:
  using: composite
  steps:
    - name: Build linux executable with Luapak
      run: tools/build-with-luapak.sh
